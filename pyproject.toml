[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spin-model-thesis"
version = "0.1.0"
description = "Spin-model simulation and VAE/clustering analysis for a senior thesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.8",
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "tensorflow>=2.16",
  "tensorflow-probability>=0.24",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["thesis_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
